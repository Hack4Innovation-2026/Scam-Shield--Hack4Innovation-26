name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install Tesseract OCR
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      - run: pip install -r requirements-dev.txt
      - name: Run tests
        env:
          TEST_MONGO_URI: mongodb://localhost:27017
        run: pytest -rs

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t scam-shield-api backend
      - name: Smoke test
        run: |
          docker run -d --name api -p 8000:8000 scam-shield-api
          for i in $(seq 1 30); do curl -sf localhost:8000/ && break; sleep 2; done
          curl -sf -X POST localhost:8000/api/v1/analyze -H "Content-Type: application/json" \
            -d '{"text":"Your account is blocked. Verify at http://bit.ly/x","source":"sms"}'
          docker logs api
